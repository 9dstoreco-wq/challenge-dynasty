name: Dynasty Production Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run check-routes
      - run: npm run check-sql
      - run: npm run check-core-flow
      - run: npm run check-production
      - run: npm run check-hardening
      - run: npm run typecheck
      - run: npm run build
